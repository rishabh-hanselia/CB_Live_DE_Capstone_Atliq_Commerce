name: CI Data Pipeline & dbt Validation

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-databricks
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks

      - name: Configure profiles.yml from GitHub Secrets
        env:
          DB_HOST: ${{ secrets.DATABRICKS_HOST }}
          DB_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DB_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mkdir -p ~/.dbt
          echo "atliq_gold:
            target: dev
            outputs:
              dev:
                type: databricks
                catalog: atliq
                schema: gold
                host: $DB_HOST
                http_path: $DB_PATH
                token: $DB_TOKEN" > ~/.dbt/profiles.yml

      - name: Install dbt dependencies
        run: |
          dbt deps

      - name: Parse and Compile dbt Project
        run: |
          dbt parse
          dbt compile